<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b16">
    <title>我的电视 · 网页配置</title>
    <link rel="stylesheet" href="./index_css.css">
    <style>
        :root {
            color-scheme: dark;
            --bg: #070b16;
            --glow: rgba(86, 124, 255, .20);
            --panel: rgba(20, 28, 48, .88);
            --panel-solid: #141c30;
            --panel-2: #1a2440;
            --line: rgba(148, 163, 205, .18);
            --line-strong: rgba(148, 163, 205, .32);
            --text: #eef2ff;
            --muted: #98a5c7;
            --accent: #6c96ff;
            --accent-2: #4776f2;
            --success: #37d399;
            --warning: #f6c453;
            --danger: #ff7a7a;
            --shadow: 0 18px 46px rgba(3, 8, 20, .48);
            --radius: 18px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #f2f5fd;
                --glow: rgba(86, 124, 255, .16);
                --panel: rgba(255, 255, 255, .92);
                --panel-solid: #ffffff;
                --panel-2: #f4f7ff;
                --line: rgba(31, 53, 102, .12);
                --line-strong: rgba(31, 53, 102, .24);
                --text: #14203b;
                --muted: #64749a;
                --accent: #3f6df0;
                --accent-2: #2f57d4;
                --shadow: 0 16px 36px rgba(39, 66, 130, .14);
            }
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background:
                radial-gradient(900px 480px at 8% -12%, var(--glow), transparent 62%),
                radial-gradient(760px 420px at 100% 0%, rgba(55, 211, 153, .08), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        [v-cloak] { display: none !important; }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        .topbar-inner {
            max-width: 860px;
            margin: 0 auto;
            padding: 13px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex: 1;
        }

        .logo {
            width: 36px;
            height: 36px;
            flex: none;
            border-radius: 11px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, #7aa2ff, #3f6df0);
            box-shadow: 0 8px 18px rgba(63, 109, 240, .35);
        }

        .brand-text { min-width: 0; }
        .brand-text strong {
            display: block;
            font-size: 15px;
            letter-spacing: .2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-text span { display: block; font-size: 11px; color: var(--muted); }

        .status {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .status.on {
            color: var(--success);
            background: rgba(55, 211, 153, .12);
            border-color: rgba(55, 211, 153, .28);
        }
        .status.off {
            color: var(--warning);
            background: rgba(246, 196, 83, .12);
            border-color: rgba(246, 196, 83, .3);
        }

        .shell {
            max-width: 860px;
            margin: 0 auto;
            padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
        }

        .tabs {
            display: flex;
            gap: 6px;
            padding: 5px;
            margin-bottom: 16px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .tab {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 12px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background .18s ease, color .18s ease;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--text);
            background: var(--panel-2);
            box-shadow: inset 0 0 0 1px var(--line);
        }
        .tab .count {
            min-width: 20px;
            padding: 1px 6px;
            border-radius: 999px;
            background: rgba(108, 150, 255, .16);
            color: var(--accent);
            font-size: 11px;
        }

        .banner {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(108, 150, 255, .08);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }
        .banner strong { color: var(--text); }
        .banner.warn {
            color: var(--warning);
            border-color: rgba(246, 196, 83, .3);
            background: rgba(246, 196, 83, .09);
        }
        .banner.info {
            color: var(--muted);
            border-color: rgba(108, 150, 255, .24);
            background: rgba(108, 150, 255, .08);
        }

        .card {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: var(--shadow);
        }
        .card + .card, .grid + .card { margin-top: 14px; }

        .grid { display: grid; gap: 14px; }
        .grid .card + .card { margin-top: 0; }
        @media (min-width: 760px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }

        .card-title { display: flex; align-items: center; gap: 11px; min-width: 0; }

        .icon {
            width: 36px;
            height: 36px;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 11px;
            color: var(--accent);
            background: rgba(108, 150, 255, .12);
            border: 1px solid rgba(108, 150, 255, .16);
        }

        h2 { margin: 0; font-size: 15px; line-height: 1.35; }
        .sub { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

        .badge {
            flex: none;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            background: var(--panel-2);
            border: 1px solid var(--line);
        }
        .badge.required {
            color: var(--danger);
            background: rgba(255, 122, 122, .1);
            border-color: rgba(255, 122, 122, .26);
        }

        .field { display: block; }
        .label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel-2);
            color: var(--text);
            font: inherit;
            font-size: 13.5px;
            line-height: 1.55;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        textarea { min-height: 94px; resize: vertical; }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: .72; }
        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 150, 255, .16);
        }

        .hint { margin: 9px 0 0; font-size: 12px; color: var(--muted); line-height: 1.65; }
        .hint code {
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            font-size: 11px;
        }

        .inline-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }
        .inline-row .hint { margin: 0; }

        .link-btn {
            flex: none;
            padding: 3px 0;
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .link-btn:hover { text-decoration: underline; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 16px;
            border-radius: 11px;
            border: 1px solid transparent;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s ease, background .18s ease, border-color .18s ease;
            white-space: nowrap;
        }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible, .tab:focus-visible, .dropzone:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .btn.primary {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 22px rgba(63, 109, 240, .28);
        }
        .btn.primary:hover { filter: brightness(1.06); }
        .btn.ghost {
            color: var(--text);
            background: transparent;
            border-color: var(--line-strong);
        }
        .btn.ghost:hover { background: var(--panel-2); }
        .btn.sm { padding: 7px 12px; font-size: 12px; }
        .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }
        .row.end { justify-content: flex-end; }

        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 28px 18px;
            border: 1px dashed rgba(108, 150, 255, .48);
            border-radius: 14px;
            background: rgba(108, 150, 255, .05);
            text-align: center;
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease;
        }
        .dropzone:hover { background: rgba(108, 150, 255, .1); border-color: var(--accent); }
        .dropzone strong { font-size: 13.5px; word-break: break-all; }
        .dropzone span { font-size: 12px; color: var(--muted); }
        .dropzone .drop-icon { color: var(--accent); margin-bottom: 3px; }
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap; border: 0;
        }

        .info-list { margin: 0; }
        .info-list > div {
            display: flex;
            gap: 14px;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }
        .info-list > div:last-child { border-bottom: 0; }
        .info-list dt { flex: none; color: var(--muted); }
        .info-list dd { margin: 0; text-align: right; word-break: break-all; }

        .actionbar {
            position: sticky;
            bottom: 12px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }
        .actionbar .grow { flex: 1; min-width: 0; }
        .actionbar .hint { margin: 0; }

        .logs {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 62vh;
            overflow: auto;
            overscroll-behavior: contain;
        }

        .log {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel-2);
        }
        .log-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--muted);
        }
        .log-meta time { margin-left: auto; font-variant-numeric: tabular-nums; }
        .level {
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .3px;
            border: 1px solid transparent;
        }
        .lv-info { color: #8ab4ff; background: rgba(108, 150, 255, .12); border-color: rgba(108, 150, 255, .2); }
        .lv-warn { color: var(--warning); background: rgba(246, 196, 83, .1); border-color: rgba(246, 196, 83, .22); }
        .lv-error { color: var(--danger); background: rgba(255, 122, 122, .1); border-color: rgba(255, 122, 122, .22); }
        .lv-debug { color: var(--muted); background: rgba(148, 163, 205, .1); border-color: var(--line); }
        .log p { margin: 8px 0 0; font-size: 13px; line-height: 1.6; word-break: break-word; }
        .log pre {
            margin: 8px 0 0;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, .16);
            color: var(--muted);
            font-size: 11.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: auto;
        }

        .empty {
            padding: 44px 18px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .state {
            min-height: 52vh;
            display: grid;
            place-items: center;
            text-align: center;
        }
        .state .card { max-width: 420px; width: 100%; }
        .state p { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
        .spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 11.5px;
        }

        @media (max-width: 520px) {
            .topbar-inner { padding: 11px 14px; }
            .shell { padding-left: 12px; padding-right: 12px; }
            .card { padding: 15px; border-radius: 16px; }
            .actionbar { flex-wrap: wrap; }
            .actionbar .grow { width: 100%; flex: auto; }
            .actionbar .btn { flex: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="logo">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2.5" y="6" width="19" height="12.5" rx="2.5"></rect>
                        <path d="M8 2.8 12 6l4-3.2"></path>
                    </svg>
                </div>
                <div class="brand-text">
                    <strong>{{ appTitle || '我的电视' }}</strong>
                    <span>网页配置</span>
                </div>
            </div>
            <span v-if="!loading" class="status" :class="configured ? 'on' : 'off'">
                {{ configured ? '已配置直播源' : '未配置直播源' }}
            </span>
        </div>
    </header>

    <main class="shell">
        <div v-if="loading" class="state">
            <div>
                <div class="spinner"></div>
                <p>正在读取配置...</p>
            </div>
        </div>

        <div v-else-if="error" class="state">
            <div class="card">
                <h2>无法读取配置</h2>
                <p>{{ error }}</p>
                <div class="row" style="justify-content:center">
                    <button type="button" class="btn primary" @click="load">重新加载</button>
                </div>
            </div>
        </div>

        <template v-else>
            <nav class="tabs" role="tablist" aria-label="配置页面导航">
                <button type="button" class="tab" :class="{ active: tab === 'config' }"
                        role="tab" :aria-selected="tab === 'config'" @click="tab = 'config'">
                    基础配置
                </button>
                <button type="button" class="tab" :class="{ active: tab === 'log' }"
                        role="tab" :aria-selected="tab === 'log'" @click="tab = 'log'">
                    运行日志
                    <span class="count">{{ logs.length }}</span>
                </button>
            </nav>

            <section v-show="tab === 'config'" role="tabpanel">
                <div v-if="!configured" class="banner warn">
                    <div><strong>尚未配置直播源。</strong>电视端将无法加载频道，请在下方填写可访问的订阅地址并保存。</div>
                </div>
                <div class="banner info">
                    <div>保存后请<strong>重启电视端应用</strong>，新的直播源与节目单才会生效。本页面只负责配置，不提供播放功能。</div>
                </div>

                <article class="card">
                    <div class="card-head">
                        <div class="card-title">
                            <span class="icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4.5 8.5a11 11 0 0 1 15 0"></path>
                                    <path d="M7.8 12a6.3 6.3 0 0 1 8.4 0"></path>
                                    <path d="M11 15.4a2.4 2.4 0 0 1 2 0"></path>
                                    <circle cx="12" cy="19" r=".9" fill="currentColor" stroke="none"></circle>
                                </svg>
                            </span>
                            <div>
                                <h2>直播源</h2>
                                <p class="sub">必填 · 支持 M3U 与 TVBox 格式</p>
                            </div>
                        </div>
                        <span class="badge required">必填</span>
                    </div>

                    <label class="field" for="iptv-source">
                        <span class="label">订阅地址</span>
                        <textarea id="iptv-source" v-model="form.iptvSourceUrl"
                                  placeholder="https://example.com/live.m3u"
                                  spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
                    </label>
                    <p class="hint">
                        支持 <code>.m3u</code> 播放列表，或包含 <code>#genre#</code> 的 TVBox 文本源。
                        地址必须能被电视端直接访问；保存时会自动清除旧的直播源缓存。
                    </p>
                </article>

                <div class="grid">
                    <article class="card">
                        <div class="card-head">
                            <div class="card-title">
                                <span class="icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect>
                                        <path d="M7.5 3v4M16.5 3v4M3.5 10h17"></path>
                                    </svg>
                                </span>
                                <div>
                                    <h2>节目单</h2>
                                    <p class="sub">可选 · XML 与 XML.GZ</p>
                                </div>
                            </div>
                        </div>
                        <label class="field" for="epg-url">
                            <span class="label">EPG 地址</span>
                            <input id="epg-url" type="text" v-model="form.epgXmlUrl"
                                   placeholder="http://epg.example.com/e.xml.gz"
                                   spellcheck="false" autocapitalize="off" autocomplete="off">
                        </label>
                        <p class="hint">留空将使用应用内置的默认节目单地址。保存时会清除旧的节目单缓存。</p>
                    </article>

                    <article class="card">
                        <div class="card-head">
                            <div class="card-title">
                                <span class="icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="9"></circle>
                                        <path d="M3.5 9h17M3.5 15h17"></path>
                                        <path d="M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3Z"></path>
                                    </svg>
                                </span>
                                <div>
                                    <h2>播放器 UA</h2>
                                    <p class="sub">可选 · 自定义请求头</p>
                                </div>
                            </div>
                        </div>
                        <label class="field" for="player-ua">
                            <span class="label">User-Agent</span>
                            <input id="player-ua" type="text" v-model="form.videoPlayerUserAgent"
                                   placeholder="ExoPlayer"
                                   spellcheck="false" autocapitalize="off" autocomplete="off">
                        </label>
                        <div class="inline-row">
                            <p class="hint">留空则使用默认 UA（ExoPlayer）。</p>
                            <button type="button" class="link-btn" @click="form.videoPlayerUserAgent = ''">恢复默认</button>
                        </div>
                    </article>
                </div>

                <article class="card">
                    <div class="card-head">
                        <div class="card-title">
                            <span class="icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 16V4"></path>
                                    <path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path>
                                    <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"></path>
                                </svg>
                            </span>
                            <div>
                                <h2>安装 APK</h2>
                                <p class="sub">上传新版本到电视端并触发安装</p>
                            </div>
                        </div>
                    </div>

                    <div class="dropzone" role="button" tabindex="0"
                         @click="pickFile" @keydown.enter.prevent="pickFile" @keydown.space.prevent="pickFile"
                         @dragover.prevent @drop.prevent="onDrop">
                        <input ref="fileInput" class="sr-only" type="file"
                               accept=".apk,application/vnd.android.package-archive"
                               @change="onFileChange">
                        <span class="drop-icon">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 16V4"></path>
                                <path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path>
                                <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"></path>
                            </svg>
                        </span>
                        <strong>{{ file ? file.name : '点击选择或拖入 APK 文件' }}</strong>
                        <span>{{ file ? formatSize(file.size) : '仅支持 .apk，上传完成后电视端会弹出安装提示' }}</span>
                    </div>

                    <div class="row end">
                        <button v-if="file" type="button" class="btn ghost" @click="file = null">移除</button>
                        <button type="button" class="btn primary" :disabled="!file || uploading" @click="upload">
                            {{ uploading ? '上传中...' : '上传并安装' }}
                        </button>
                    </div>
                </article>

                <article class="card">
                    <div class="card-head">
                        <div class="card-title">
                            <span class="icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9"></circle>
                                    <path d="M12 11v5.5"></path>
                                    <circle cx="12" cy="7.6" r=".9" fill="currentColor" stroke="none"></circle>
                                </svg>
                            </span>
                            <div>
                                <h2>访问信息</h2>
                                <p class="sub">当前配置服务地址</p>
                            </div>
                        </div>
                    </div>
                    <dl class="info-list">
                        <div>
                            <dt>当前地址</dt>
                            <dd><code>{{ serverOrigin }}</code></dd>
                        </div>
                        <div>
                            <dt>应用仓库</dt>
                            <dd>
                                <a v-if="appRepo" :href="appRepo" target="_blank" rel="noreferrer">{{ appRepo }}</a>
                                <span v-else>—</span>
                            </dd>
                        </div>
                    </dl>
                    <p class="hint">该服务仅在局域网内可用且没有登录鉴权，请勿在公共网络中开放 10481 端口。</p>
                </article>

                <div class="actionbar">
                    <span class="grow hint">{{ dirty ? '有未保存的修改' : '当前配置已同步' }}</span>
                    <button type="button" class="btn ghost" :disabled="!dirty || saving" @click="resetForm">撤销</button>
                    <button type="button" class="btn primary" :disabled="saving || !dirty" @click="save">
                        {{ saving ? '保存中...' : '保存配置' }}
                    </button>
                </div>
            </section>

            <section v-show="tab === 'log'" role="tabpanel">
                <article class="card">
                    <div class="card-head">
                        <div class="card-title">
                            <span class="icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18V6A1.5 1.5 0 0 1 5 4.5Z"></path>
                                    <path d="M7 9h10M7 12.5h10M7 16h6"></path>
                                </svg>
                            </span>
                            <div>
                                <h2>运行日志</h2>
                                <p class="sub">最近 50 条应用日志</p>
                            </div>
                        </div>
                        <button type="button" class="btn ghost sm" @click="refreshLogs">刷新</button>
                    </div>

                    <div v-if="!logs.length" class="empty">暂无日志</div>
                    <ul v-else class="logs">
                        <li v-for="(log, index) in logs" :key="index" class="log">
                            <div class="log-meta">
                                <span class="level" :class="levelClass(log.level)">{{ log.level }}</span>
                                <code>{{ log.tag }}</code>
                                <time>{{ formatTime(log.time) }}</time>
                            </div>
                            <p>{{ log.message }}</p>
                            <pre v-if="log.cause">{{ log.cause }}</pre>
                        </li>
                    </ul>
                </article>
            </section>
        </template>

        <footer class="footer">
            <span>{{ appTitle || '我的电视' }} · 网页配置</span>
            <a v-if="appRepo" :href="appRepo" target="_blank" rel="noreferrer">项目主页</a>
            <span v-else>修改配置后需重启电视端应用</span>
        </footer>
    </main>
</div>
<script src="./index_js.js"></script>
<script>
    const { createApp, ref, computed, onMounted } = Vue

    createApp({
        setup() {
            const loading = ref(true)
            const saving = ref(false)
            const uploading = ref(false)
            const error = ref('')
            const tab = ref('config')
            const appTitle = ref('我的电视')
            const appRepo = ref('')
            const serverOrigin = window.location.origin
            const fileInput = ref(null)
            const file = ref(null)
            const logs = ref([])

            const emptyForm = () => ({
                iptvSourceUrl: '',
                epgXmlUrl: '',
                videoPlayerUserAgent: '',
            })

            const form = ref(emptyForm())
            const original = ref(emptyForm())

            const configured = computed(() => !!form.value.iptvSourceUrl.trim())
            const dirty = computed(() => {
                return form.value.iptvSourceUrl.trim() !== original.value.iptvSourceUrl.trim()
                    || form.value.epgXmlUrl.trim() !== original.value.epgXmlUrl.trim()
                    || form.value.videoPlayerUserAgent.trim() !== original.value.videoPlayerUserAgent.trim()
            })

            async function request(url, options) {
                const response = await fetch(url, options)
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status)
                }
                return response
            }

            function applySettings(data) {
                appTitle.value = data.appTitle || '我的电视'
                appRepo.value = data.appRepo || ''
                form.value = {
                    iptvSourceUrl: data.iptvSourceUrl || '',
                    epgXmlUrl: data.epgXmlUrl || '',
                    videoPlayerUserAgent: data.videoPlayerUserAgent || '',
                }
                original.value = Object.assign({}, form.value)
                logs.value = Array.isArray(data.logHistory) ? data.logHistory.slice().reverse() : []
            }

            async function load() {
                loading.value = true
                error.value = ''
                try {
                    const response = await request('/api/settings')
                    applySettings(await response.json())
                } catch (e) {
                    error.value = '请确认电视端应用已启动，并且手机或电脑与电视处于同一局域网。'
                } finally {
                    loading.value = false
                }
            }

            function resetForm() {
                form.value = Object.assign({}, original.value)
            }

            function validateUrl(value, label) {
                if (value && !/^https?:\/\/\S+$/i.test(value)) {
                    vant.showFailToast(label + '需以 http:// 或 https:// 开头')
                    return false
                }
                return true
            }

            async function save() {
                if (saving.value) return

                const iptvSourceUrl = form.value.iptvSourceUrl.trim()
                const epgXmlUrl = form.value.epgXmlUrl.trim()
                const videoPlayerUserAgent = form.value.videoPlayerUserAgent.trim()

                if (!validateUrl(iptvSourceUrl, '直播源地址')) return
                if (!validateUrl(epgXmlUrl, '节目单地址')) return

                saving.value = true
                vant.showLoadingToast({ message: '正在保存...', forbidClick: true, duration: 0 })
                try {
                    await request('/api/settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            iptvSourceUrl: iptvSourceUrl,
                            epgXmlUrl: epgXmlUrl,
                            videoPlayerUserAgent: videoPlayerUserAgent,
                        }),
                    })

                    const response = await request('/api/settings')
                    applySettings(await response.json())

                    vant.closeToast()
                    if (iptvSourceUrl) {
                        vant.showSuccessToast('配置已保存，请重启电视端应用')
                    } else {
                        vant.showToast('已保存，但尚未配置直播源')
                    }
                } catch (e) {
                    vant.closeToast()
                    vant.showFailToast('保存失败：' + e.message)
                } finally {
                    saving.value = false
                }
            }

            async function refreshLogs() {
                try {
                    const response = await request('/api/settings')
                    const data = await response.json()
                    logs.value = Array.isArray(data.logHistory) ? data.logHistory.slice().reverse() : []
                    vant.showSuccessToast('日志已刷新')
                } catch (e) {
                    vant.showFailToast('刷新失败：' + e.message)
                }
            }

            function pickFile() {
                if (fileInput.value) fileInput.value.click()
            }

            function setFile(selected) {
                if (!selected) return
                if (!/\.apk$/i.test(selected.name)) {
                    vant.showFailToast('请选择 .apk 文件')
                    return
                }
                file.value = selected
            }

            function onFileChange(event) {
                setFile(event.target.files && event.target.files[0])
                event.target.value = ''
            }

            function onDrop(event) {
                setFile(event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0])
            }

            async function upload() {
                if (!file.value || uploading.value) return

                uploading.value = true
                vant.showLoadingToast({ message: '正在上传...', forbidClick: true, duration: 0 })
                const body = new FormData()
                body.append('file', file.value, file.value.name)

                try {
                    await request('/api/upload/apk', { method: 'POST', body: body })
                    file.value = null
                    vant.closeToast()
                    vant.showSuccessToast('上传完成，请在电视端确认安装')
                } catch (e) {
                    vant.closeToast()
                    vant.showFailToast('上传失败：' + e.message)
                } finally {
                    uploading.value = false
                }
            }

            function formatSize(size) {
                if (!size && size !== 0) return ''
                if (size < 1024) return size + ' B'
                if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB'
                return (size / 1024 / 1024).toFixed(1) + ' MB'
            }

            function formatTime(time) {
                if (!time) return ''
                const date = new Date(time)
                const pad = value => String(value).padStart(2, '0')
                return pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + ' '
                    + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds())
            }

            function levelClass(level) {
                return 'lv-' + String(level || 'debug').toLowerCase()
            }

            onMounted(load)

            return {
                loading, saving, uploading, error, tab,
                appTitle, appRepo, serverOrigin,
                fileInput, file, logs, form,
                configured, dirty,
                load, resetForm, save, refreshLogs,
                pickFile, onFileChange, onDrop, upload,
                formatSize, formatTime, levelClass,
            }
        },
    }).mount('#app')
</script>
</body>
</html>
